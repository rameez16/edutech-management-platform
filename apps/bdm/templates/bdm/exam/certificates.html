<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            width: 100%;
            height: 100%;
            text-align: center;
            font-family: 'Times New Roman', serif;
            padding: 100px 60px;
            border: 10px solid #2c3e50;
        }

        .title {
            font-size: 48px;
            font-weight: bold;
            color: #2c3e50;
        }

        .subtitle {
            font-size: 20px;
            margin-top: 20px;
        }

        .name {
            font-size: 40px;
            font-weight: bold;
            margin: 30px 0;
            color: #1a5276;
        }

        .course {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }

        .grade {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
            color: #196F3D; /* Dark green */
        }

        .details {
            margin-top: 40px;
            font-size: 16px;
        }

        .signature-section {
            margin-top: 80px;
            display: flex;
            justify-content: space-between;
        }

        .sign {
            width: 200px;
            border-top: 1px solid black;
            padding-top: 5px;
        }
    </style>
</head>
<body>

    <div class="title">CERTIFICATE OF COMPLETION</div>

    <div class="subtitle">This is to certify that</div>

    <div class="name">{{ student_name }}</div>

    <div class="subtitle">has successfully completed the course</div>

    <div class="course">{{ batch_name }}</div>

    <!-- Grade added here -->
    <div class="grade">Grade: {{ grade }}</div>

    <div class="details">
        Issue Date: {{ issue_date }} <br>
        Certificate No: {{ certificate_number }}
    </div>

</body>
</html>
