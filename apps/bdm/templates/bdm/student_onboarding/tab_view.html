{% extends 'bdm/layout/base.html' %}
{% load static %}
{% load tz %}

{% block content %}

<div class="tabs">
    <button class="tab-btn active" data-url="{% url 'bdm:document_verification' %}">
        Document Verification
    </button>
    <button class="tab-btn" data-url="{% url 'bdm:enrollment_letter_generation' %}">
        Generate Enrollment Letter
    </button>
        Generate ID card   
    <button class="tab-btn" data-url="{% url 'bdm:id_card_generation' %}">
        
    </button>
   
</div>

<div id="tab-content">
    Loading...
</div>

<script>
    const buttons = document.querySelectorAll(".tab-btn");
    const content = document.getElementById("tab-content");

    function loadTab(url) {
        fetch(url)
            .then(res => res.text())
            .then(html => content.innerHTML = html);
    }

    buttons.forEach(btn => {
        btn.addEventListener("click", () => {
            buttons.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            loadTab(btn.dataset.url);
        });
    });

    // load first tab
    loadTab(buttons[0].dataset.url);
</script>

{% endblock %}
