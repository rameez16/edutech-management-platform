{% extends 'layout/base.html' %}
{% load static %}

{% block title %}My Profile{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'student/css/profile.css' %}">
{% endblock %}

{% block content %}
<div class="student-profile">

    <!-- PAGE TITLE -->
    <h2 class="profile-title" style="margin-bottom: 24px;">My Profile</h2>

    <!-- PROFILE CARD -->
    <div class="profile-card">
        
        <!-- PROFILE TOP -->
        <div class="profile-top">
            <div class="avatar-section">
                <div class="avatar-circle">
                    <svg viewBox="0 0 100 100" class="avatar-icon">
                        <circle cx="50" cy="35" r="18" fill="currentColor"/>
                        <path d="M 25 75 Q 25 55 50 55 Q 75 55 75 75" fill="currentColor"/>
                    </svg>
                </div>
            </div>
            <div class="profile-identity">
                <h3 class="student-name">{{ student.name|default:"Student name" }}</h3>
                <p class="student-id">Student Id: {{ student.id|default:"123456" }}</p>
            </div>
        </div>

        <!-- PROFILE FORM -->
        <form class="profile-form" method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="email">Email id</label>
                <input type="email" id="email" name="email" value="{{ student.email|default:'' }}" readonly>
            </div>

            <div class="form-group">
                <label for="phone">Phone no</label>
                <input type="tel" id="phone" name="phone" value="{{ student.phone|default:'' }}" readonly>
            </div>

            <div class="form-group">
                <label for="dob">Date of birth</label>
                <input type="date" id="dob" name="dob" value="{{ student.dob|default:'' }}" readonly>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <input type="text" id="gender" name="gender" value="{{ student.gender|default:'' }}" readonly>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" value="{{ student.address|default:'' }}" readonly>
            </div>

            <div class="form-actions">
                <button type="button" class="btn primary" onclick="enableEdit()">Edit profile</button>
            </div>
        </form>

    </div>

</div>


{% endblock %}
