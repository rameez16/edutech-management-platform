{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}LMS{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- LMS CSS -->
    <link rel="stylesheet" href="{% static 'student/css/lms_dashboard.css' %}">
</head>
<body>

<div class="app-wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>LMS</span>
        </div>

        <ul class="menu">
            <li><a href="{% url 'student:lms_dashboard' %}"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>
            <li><a href="#"><i class="fa-solid fa-user"></i> Profile</a></li>
            <li><a href="#"><i class="fa-solid fa-book"></i> Course & Syllabus</a></li>
            <li><a href="#"><i class="fa-solid fa-calendar-check"></i> Attendance</a></li>
            <li><a href="#"><i class="fa-solid fa-list-check"></i> Tasks</a></li>
            <li><a href="#"><i class="fa-solid fa-bullhorn"></i> Announcements</a></li>
            <li><a href="#"><i class="fa-solid fa-chart-line"></i> Evaluation</a></li>
            <li><a href="#" class="logout-static"> <i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>

            {% csrf_token %}
        <button type="submit" class="logout-link">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </button>
    </form>
</li>
        </ul>
    </aside>

    <!-- CONTENT -->
    <main class="content">
        {% block content %}{% endblock %}
    </main>

</div>

</body>
</html>
