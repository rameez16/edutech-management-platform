{% extends "student/layout/base.html" %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'student/css/notification.css' %}">

<div class="notifications-page">

<h2 class="page-title">🔔 Notifications</h2>

{% if notifications %}

{% for n in notifications %}

<form method="POST" class="notification-form">
{% csrf_token %}

<input type="hidden" name="notification_id" value="{{ n.id }}">

<button type="submit" class="notification-card">

<div class="notification-icon">🔔</div>

<div class="notification-content">

<div class="notification-header">

<h4 class="notification-title">{{ n.title }}</h4>

<span class="notification-date">
{{ n.created_at|date:"d M Y, h:i A" }}
</span>

</div>

<p class="notification-message">
{{ n.message }}
</p>

</div>

</button>

</form>

{% endfor %}

{% else %}

<div class="empty-state">
🔕 No notifications
</div>

{% endif %}

</div>

{% endblock %}
