{% extends 'student/layout/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'student/css/QR_pay.css' %}">

<div class="main-content qr-main">

    <div class="qr-card">

        <h2 class="qr-title">Scan & Pay (PDC)</h2>

        <!-- QR CODE -->
        <div class="qr-image">
            <img src="{% static 'student/images/image.png' %}" alt="QR Code">
        </div>

        <!-- DETAILS -->
        <div class="qr-info">
            <p><strong>Amount:</strong> ₹2,000</p>
            <p><strong>Due Date:</strong> 10-Mar-2026</p>
        </div>

        <!-- RECEIPT UPLOAD -->
        <form method="post" enctype="multipart/form-data" class="receipt-form">
            {% csrf_token %}
            <label class="upload-btn">
                Upload Receipt
                <input type="file" name="receipt" hidden required>
            </label>
            <button type="submit" class="submit-btn">Submit</button>
        </form>

        <!-- BACK -->
        <a href="{% url 'pdc' %}" class="back-btn">← Back to PDC</a>

    </div>

</div>

{% endblock %}
