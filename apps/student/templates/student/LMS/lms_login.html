{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'student/css/lms_login.css' %}">
</head>
<body>

<div class="page">
    <div class="card">

        <!-- LEFT IMAGE -->
        <div class="left">
            <div class="img-box">
                <img src="{% static 'student/images/newlms.png' %}" alt="Student">
            </div>
        </div>

        <!-- RIGHT LOGIN -->
        <div class="right">
            <div class="logo">Welcome to  <span>LMS Portal</span></div>

            <h2>Login</h2>
            <p class="desc">Enter your credentials to login to your account</p>

            <!-- ✅ FORM -->
            <form onsubmit="goDashboard(event)">

                <label>User Name</label>
                <input type="text" placeholder="Enter your User Name" required>

                <label>Password</label>
                <input type="password" placeholder="********" required>

                <div class="row">
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">Sign in</button>
            </form>

        </div>
    </div>
</div>



</body>
</html>
