{% extends 'layout/base.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'student/css/profile.css' %}">

<div class="main-content password-page">

    <!-- HEADER -->
    <div class="page-header">
        <h2>Student Settings</h2>
        <p>Password</p>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <a href="/overview/" class="tab-link">Overview</a>
        <a href="/profile/" class="tab-link">Profile</a>
        <a href="/password/" class="tab-link active">Password</a>
    </div>

    <!-- PASSWORD CARD -->
    <div class="profile-card password-card">

        <h4 class="section-title">Change Password</h4>

        <form method="post">
            {% csrf_token %}

            <div class="form-row">
                <div class="form-group full">
                    <label>Current Password</label>
                    <input type="password" name="current_password" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="new_password" required>
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" name="confirm_password" required>
                </div>
            </div>

            <ul class="password-rules">
                <li>At least 8 characters</li>
                <li>Include one number</li>
                <li>Include one special character</li>
            </ul>

            <div class="form-actions">
                <button type="submit" class="save-btn">
                    Update Password
                </button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
