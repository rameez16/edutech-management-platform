{% extends 'layout/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'student/css/profile.css' %}">

<div class="main-content">

    <!-- HEADER -->
    <div class="page-header">
       <center> <h2>Student Settings</h2></center>
    </div>

    <!-- TABS -->
      
    <div class="tabs">
        <a href="/overview/" class="tab-link">Overview</a>
        <a href="/profile/" class="tab-link active">Profile</a>
        <a href="/password/" class="tab-link">Password</a>
    </div>
     

    <!-- PROFILE CARD -->
    <div class="profile-card">

        <!-- PROFILE HEADER -->
        <div class="profile-header">

            <!-- PROFILE PHOTO -->
            <div class="profile-pic-wrapper">
                <img src="https://via.placeholder.com/100"
                     id="profilePreview"
                     class="profile-img">

                <!-- EDIT ICON -->
                <label for="profileImageInput" class="photo-edit-icon">✎</label>

                <!-- SAME FILE INPUT (JUST HIDDEN BY CSS) -->
                <input type="file"
                       id="profileImageInput"
                       name="profile_photo"
                       accept="image/*"
                       class="hidden-file-input"
                       onchange="previewProfileImage(event)">
            </div>

            <div class="profile-name-block">
                <h3>Rinta</h3>
                <span class="student-id">Profile completed</span>
            </div>

        </div>

        <!-- FORM -->
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- BASIC DETAILS -->
            <h4 class="section-title">Basic Details</h4>

            <div class="form-row">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="full_name">
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender">
                        <option value="">Select</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>
            </div>

            <!-- CONTACT -->
            <h4 class="section-title">Contact</h4>

            <div class="form-row">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email">
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" name="phone">
                </div>
            </div>

            <div class="form-group full">
                <label>Bio</label>
                <textarea name="bio"></textarea>
            </div>

            <!-- EDUCATION -->
            <h4 class="section-title">Education</h4>

            <div class="form-row">
                <div class="form-group">
                    <label>Current Education</label>
                    <select name="current_education">
                        <option>BSc</option>
                        <option>Diploma</option>
                        <option>High School</option>
                        <option>MTech</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Institution</label>
                    <input type="text" name="institution">
                </div>
            </div>

            <div class="form-group full">
                <label>Learning Goals</label>
                <textarea name="learning_goals"></textarea>
            </div>

            <!-- SKILLS -->
            <h4 class="section-title">Skills & Domain</h4>

            <div class="form-row">
                <div class="form-group">
                    <label>Preferred Domain</label>
                    <select name="preferred_domain">
                        <option>Web</option>
                        <option>Data</option>
                        <option>Mobile</option>
                        <option>AI</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Experience Level</label>
                    <select name="experience_level">
                        <option>Beginner</option>
                        <option>Intermediate</option>
                        <option>Advanced</option>
                    </select>
                </div>
            </div>

            <div class="form-group full">
                <label>Skills</label>
                <input type="text" name="skills" placeholder="Python, HTML, SQL">
            </div>

            <!-- LINKS -->
            <h4 class="section-title">Links</h4>

            <div class="form-group full">
                <label>Portfolio URL</label>
                <input type="url" name="portfolio_url">
            </div>

            <!-- SAVE -->
            <div class="form-actions">
                <button type="submit" class="save-btn">
                    Save Profile
                </button>
            </div>

        </form>
    </div>
</div>

<script>
function previewProfileImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function () {
        document.getElementById('profilePreview').src = reader.result;
    };
    reader.readAsDataURL(file);
}
</script>

{% endblock %}
