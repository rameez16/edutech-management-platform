{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}EduTech{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'trainer/css/templatemo-glass-admin-style.css' %}">

    <!-- Alertify CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/alertify.min.css"/>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/themes/default.min.css"/>

    <!-- Custom Alertify Styles -->
<style>
    /* Base / Default */
    .alertify-notifier .ajs-message {
        background: linear-gradient(135deg, #1D4ED8, #0EA5E9);
        color: #fff;
        border: none;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(59, 130, 246, 0.25);
        font-family: 'DM Sans', -apple-system, sans-serif;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 0.875rem 1.25rem;
    }
    /* Success */
    .alertify-notifier .ajs-message.ajs-success {
        background: linear-gradient(135deg, #2563EB, #0EA5E9);
        box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
    }
    /* Error */
    .alertify-notifier .ajs-message.ajs-error {
        background: linear-gradient(135deg, #DC2626, #F87171);
        box-shadow: 0 8px 24px rgba(220, 38, 38, 0.35);
    }
    /* Warning */
    .alertify-notifier .ajs-message.ajs-warning {
        background: linear-gradient(135deg, #D97706, #FBBF24);
        box-shadow: 0 8px 24px rgba(217, 119, 6, 0.35);
    }
    /* Dismiss button */
    .alertify-notifier .ajs-message .ajs-close {
        color: rgba(255, 255, 255, 0.8);
    }
    .alertify-notifier .ajs-message .ajs-close:hover {
        color: #fff;
    }
    /* Position */
    .alertify-notifier.ajs-right { right: 1.5rem; }
    .alertify-notifier.ajs-top   { top: 2rem; }
</style>
</head>

<!-- Alertify JS -->
<script src="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/alertify.min.js"></script>

<body>

<!-- Background Effects -->
<div class="background"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="dashboard">

    {% include "trainer/partials/_sidebar.html" %}

    <!-- MAIN CONTENT -->
    <main class="main-content">

        {% include "trainer/partials/_header.html" %}

        <!-- PAGE CONTENT -->
        <div class="page-content">
            {% block content %}{% endblock %}
        </div>

        <!-- FOOTER ALWAYS AT END -->
        {% include "trainer/partials/_footer.html" %}

    </main>

</div>

<button class="mobile-menu-toggle">☰</button>

<script src="{% static 'trainer/js/templatemo-glass-admin-script.js' %}"></script>

{% if messages %}
<script>
    {% for message in messages %}
        alertify.set('notifier','position', 'top-right');

        {% if message.tags == 'success' %}
            alertify.success("{{ message|escapejs }}");
        {% elif message.tags == 'error' %}
            alertify.error("{{ message|escapejs }}");
        {% elif message.tags == 'warning' %}
            alertify.warning("{{ message|escapejs }}");
        {% else %}
            alertify.message("{{ message|escapejs }}");
        {% endif %}
    {% endfor %}
</script>
{% endif %}

</body>
</html>
