{% extends "trainer/mybatches/base.html" %}

{% block tab_content %}

<div class="glass-card">

    <!-- Header -->
    <h4 class="card-title" style="display:flex;align-items:center;gap:8px;">
        <a href="{% url 'trainer:batch-students' batch.id %}"
           style="display:inline-flex;align-items:center;color:inherit;text-decoration:none;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 width="20" height="20">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </a>
        Student Details
    </h4>

    <!-- Student Info -->
    <div class="student-detail-grid">

        <div class="detail-row">
            <span class="detail-label">Full Name</span>
            <span class="detail-value">
                {{ student.full_name|default:student.user.username }}
            </span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Email</span>
            <span class="detail-value">
                {{ student.email|default:"—" }}
            </span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Phone</span>
            <span class="detail-value">
                {{ student.phone|default:"—" }}
            </span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Gender</span>
            <span class="detail-value">
                {{ student.get_gender_display|default:"—" }}
            </span>
        </div>
    </div>

</div>

{% endblock %}
