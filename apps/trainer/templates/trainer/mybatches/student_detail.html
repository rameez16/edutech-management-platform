{% extends "trainer/mybatches/base.html" %}

{% block tab_content %}

<div class="glass-card">

    <!-- Heading with back arrow -->
    <h4 class="card-title" style="display: flex; align-items: center; gap: 8px;">
        <!-- SVG Back Arrow -->
        <a href="{% url 'trainer:batch-students' batch_id %}" style="display: inline-flex; align-items: center; color: inherit; text-decoration: none;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </a>

        Student Details
    </h4>

    <div class="student-detail-grid">

        <div class="detail-row">
            <span class="detail-label">Name</span>
            <span class="detail-value">{{ student.name }}</span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Phone</span>
            <span class="detail-value">{{ student.phone }}</span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Email</span>
            <span class="detail-value">{{ student.email }}</span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Status</span>
            <span class="status {% if student.status == 'Active' %}active{% else %}inactive{% endif %}">
                {{ student.status }}
            </span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Joined On</span>
            <span class="detail-value">{{ student.joined_on }}</span>
        </div>

    </div>

</div>

{% endblock %}
